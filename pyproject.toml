[project]
name = "bio-pdf"
version = "0.1.0"
description = "Auditable, recoverable Python demo for biological paper/patent PDF sequence and activity extraction."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Bio PDF Workflow" },
]
keywords = [
    "pdf",
    "biology",
    "patent",
    "sequence",
    "extraction",
]

# Core dependencies are intentionally parser-agnostic. Downstream parser
# integrations (Docling, MinerU, LLM providers) ship as optional extras so
# the core CLI and domain code can run in environments without the heavy
# ML dependencies.
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "pypdfium2>=4.30,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "reportlab>=4,<5",
    "ruff>=0.5,<1",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]
docling = [
    # Pin the integration range; we confirm exact versions during Task 5.
    "docling>=2.13,<3",
    # The docling-serve HTTP adapter needs only httpx (no SDK), but both
    # live in the same extra so a single install enables local SDK + remote.
    "httpx>=0.27,<1",
]
mineru = [
    # HTTP adapter only; no pinned SDK in this phase.
    "httpx>=0.27,<1",
]
rapidocr = [
    "rapidocr>=3.9.1,<4",
    "onnxruntime>=1.20,<2",
]
llm = [
    "httpx>=0.27,<1",
]

[project.scripts]
bio-pdf = "bio_pdf.cli:app"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bio_pdf"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: marks tests that require real external systems (deselect with -m 'not live')",
    "integration: marks tests that exercise multiple modules end-to-end",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",  # line length is enforced by formatter
]
